
[package]
name = "hashedtokens"
version = "0.1.0"
edition = "2024"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
reqwest = { version = "0.12", features = ["json"] }
tokio = { version = "1.38", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
thiserror = "1.0"
bytes = "1"
tokio-tungstenite = { version = "0.30.0", features = ["native-tls"] }
futures-util = { version = "0.3.34", default-features = false, features = ["sink", "std"] }

[dev-dependencies]
axum = { version = "0.8.9", features = ["ws", "json"] }
wiremock = "0.6.5"
